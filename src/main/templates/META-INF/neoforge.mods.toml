modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "logo.png"
# Pixel art: render it sharp instead of smoothed.
logoBlur = false
displayURL = "https://www.curseforge.com/minecraft/mc-mods/fallout-enemy-hud-and-mutations"
issueTrackerURL = "https://github.com/JPZamps/fallout-enemy-hud-and-mutations/issues"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
