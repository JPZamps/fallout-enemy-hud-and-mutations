plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = mod_version
group = mod_group_id

base {
    // The jar is named after the mod, not the internal mod_id.
    archivesName = 'FalloutEnemyHUD'
}

// Minecraft 1.21.1 runs on Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    // Read-only widening of BossHealthOverlay.events, so the target readout knows how far
    // to drop below the boss bars.
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // No third-party dependencies: everything is built from vanilla and NeoForge.
}

// neoforge.mods.toml is a template so the build can substitute the properties below.
final Map<String, ?> modMetadata = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
]

final TaskProvider<ProcessResources> generateModMetadata =
        tasks.register('generateModMetadata', ProcessResources) {
            inputs.properties(modMetadata)
            expand(modMetadata)
            from 'src/main/templates'
            into layout.buildDirectory.dir('generated/sources/modMetadata')
        }

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
